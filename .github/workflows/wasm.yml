name: wasm

on:
  push:
    branches:
      - master
      - pyodide-2.1
      - pyodide-2.1-2026_5
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; branch pushes always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testsuite:
    name: wasm32 testsuite + semicolon-lapack (emsdk ${{ matrix.emsdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        emsdk:
          - '5.0.3'
          - '6.0.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Self-test the semicolon-lapack result checker
        run: bash ci/wasm/check-lapack-results-selftest.sh

      - name: Install Emscripten ${{ matrix.emsdk }}
        # emsdk lives outside the checkout, like ci/do_riscv.sh's
        # toolchain dir; cloning the tag pins installer and toolchain.
        env:
          EMSDK_VERSION: ${{ matrix.emsdk }}
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git ../emsdk
          ../emsdk/emsdk install "$EMSDK_VERSION"
          ../emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build BLIS and run the fast testsuite under Node
        env:
          EMSDK: ${{ github.workspace }}/../emsdk
        # Pass the setup-node Node 24 explicitly; do_wasm.sh would
        # otherwise default to emsdk's bundled node ($EMSDK_NODE).
        run: NODE="$(command -v node)" ci/wasm/do_wasm.sh

      - name: Install pinned Meson, Ninja and CMake
        run: |
          python3 -m venv ../build-tools
          ../build-tools/bin/pip install \
            'meson==1.12.1' 'ninja==1.13.2' 'cmake==4.2.3'

      - name: Link semicolon-lapack against the candidate archive and test
        env:
          EMSDK: ${{ github.workspace }}/../emsdk
        # NODE captures the setup-node Node 24 path before emsdk_env.sh can
        # prepend emsdk's bundled node (6.0.5 ships Node 22).
        run: |
          export PATH="$PWD/../build-tools/bin:$PATH"
          NODE="$(command -v node)" ci/wasm/do_lapack.sh

      - name: Upload logs and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-testsuite-lapack-emsdk-${{ matrix.emsdk }}
          path: wasm-artifacts/
          if-no-files-found: warn
          retention-days: 14

  scipy:
    # Not part of the emsdk matrix: cibuildwheel installs the Emscripten
    # version that its Pyodide cross-build environment was built with
    # (Pyodide 314.0.7 -> Emscripten 5.0.3 for cibuildwheel 4.3.4), the
    # same toolchain SciPy's own Pyodide CI uses. See ci/wasm/do_scipy.sh.
    name: SciPy tests (Pyodide cp314, BLIS + semicolon-lapack)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      # The SciPy commit is pinned in do_scipy.sh, so most objects are
      # unchanged between runs; only BLIS changes recompile.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-scipy-ccache-${{ hashFiles('ci/wasm/do_scipy.sh') }}-${{ github.run_id }}
          restore-keys: |
            wasm-scipy-ccache-${{ hashFiles('ci/wasm/do_scipy.sh') }}-
            wasm-scipy-ccache-

      - name: Build SciPy against this BLIS and run SciPy's tests
        env:
          EM_COMPILER_WRAPPER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: '%compiler% --version'
          CCACHE_MAXSIZE: 500M
        run: |
          ci/wasm/do_scipy.sh
          ccache -s

      - name: Upload logs and the tested wheel
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-scipy
          path: wasm-artifacts/scipy/
          if-no-files-found: warn
          retention-days: 14
